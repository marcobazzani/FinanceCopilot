name: finance_copilot
description: "Personal wealth management app — replaces MoneyHistory.xlsx"
publish_to: 'none'
# Placeholder only — the real version is injected at build time from the git
# tag via CI (--build-name/--build-number). Never bump this by hand; local/dev
# builds intentionally report 0.0.0 so they are obviously not a release.
version: 0.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2

  # Database (drift + SQLite)
  drift: ^2.31.0
  drift_flutter: ^0.2.8
  sqlite3: any
  sqlite3_flutter_libs: any
  path_provider: ^2.1.5
  path: ^1.9.1

  # Charts
  fl_chart: ^1.2.0

  # File import
  csv: ^8.0.0
  excel:
    git:
      url: https://github.com/justkawal/excel.git
      ref: main
  file_picker: ^11.0.2
  pdfrx: ^2.4.1

  # HTTP (market data)
  dio: ^5.8.0

  # HTML parsing (DOM, not regex)
  html: ^0.15.4

  url_launcher: ^6.3.1

  # Headless WebView (Cloudflare cookie solving for the market data provider)
  flutter_inappwebview: ^6.1.5

  # Google Drive sync
  google_sign_in: ^7.2.0
  extension_google_sign_in_as_googleapis_auth: ^3.0.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.3.1
  http: ^1.2.0

  # Hashing (import dedup)
  crypto: ^3.0.6

  # Utils
  intl: ^0.20.2
  collection: ^1.19.1
  json_annotation: ^4.11.0
  logging: ^1.3.0
  receive_sharing_intent: ^1.8.1

  # ATH celebration overlay particles (no native plugins, pure Dart)
  confetti: ^0.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # Drift code generation
  drift_dev: ^2.31.0
  build_runner: ^2.15.0

  # Riverpod code generation
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

  # JSON serialization
  json_serializable: ^6.13.0

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
    - assets/default_charts.json
    - PortfolioModels/
    - PortfolioModels/2021/20-equity/
    - PortfolioModels/2021/40-equity/
    - PortfolioModels/2021/60-equity/
    - PortfolioModels/2021/80-equity/
    - PortfolioModels/2024/0-equity/
    - PortfolioModels/2024/20-equity/
    - PortfolioModels/2024/40-equity/
    - PortfolioModels/2024/60-equity/
    - PortfolioModels/2024/80-equity/
    - PortfolioModels/2024/100-equity/
    - PortfolioModels/2026/0-equity/
    - PortfolioModels/2026/20-equity/
    - PortfolioModels/2026/40-equity/
    - PortfolioModels/2026/60-equity/
    - PortfolioModels/2026/80-equity/
    - PortfolioModels/2026/100-equity/
    # Test fixtures — bundled for integration tests (negligible size in release)
    - integration_test/fixtures/
    - integration_test/fixtures/pension/
